<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>KlassikernN – Køkontroll</title></head><body class="admin-body"><div class="admin-wrap"><h1>KlassikernN – Køkontroll</h1><section id="login" class="panel"><h2>Logg inn</h2><form id="login-form"><label>Admin-passord <input id="password" type="password" autocomplete="current-password" required></label><button>Logg inn</button></form></section><div id="app" class="hidden"><section class="panel"><h2>Legg til manuelt</h2><form id="add-form"><label>Offentlig visningsnavn<input id="name" required maxlength="55" placeholder="F.eks. PokeSamler"></label><label>Pakke / produkt<input id="product" required maxlength="80" placeholder="F.eks. Surging Sparks"></label><div class="flex"><label>Antall<input id="qty" type="number" min="1" max="100" value="1" required></label><button type="submit">Legg til</button></div></form></section><section class="panel"><div class="flex"><h2>Bestillingskø</h2><button type="button" id="refresh" class="secondary">Oppdater</button></div><p class="hint">«Åpnes nå» velger aktiv bestilling. «Fullført» fjerner fra visningskøen, men beholder historikk.</p><div id="list"></div></section></div><p id="error" class="error"></p><p class="hint">Kun kødata vises i overlayen. Fullt kundenavn, adresse og e-post lagres ikke av denne appen.</p></div><script src="/admin.js"></script></body></html>
