services:
  klassikernn-queue:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      COOKIE_SECURE: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Dokploy environment}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:?Set Shopify webhook signing secret}
      SHOP_DOMAIN: ${SHOP_DOMAIN:?Set myshopify.com shop domain}
      OVERLAY_KEY: ${OVERLAY_KEY:?Set OVERLAY_KEY}
      SESSION_KEY: ${SESSION_KEY:?Set SESSION_KEY}
      RIP_SKU_PREFIX: ${RIP_SKU_PREFIX:-}
    volumes:
      - queue_data:/data
    security_opt:
      - no-new-privileges:true
volumes:
  queue_data:
